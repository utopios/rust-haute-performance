[package]
name = "demos"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
criterion = {version = "0.5", features = ["html_reports"]}

[dependencies]
rayon = "1.10"
dhat = { version = "0.3", optional = true }
rand = "0.9"
smallvec = "1.13"
parking_lot = "0.12"
crossbeam = "0.8"
dashmap   = "5"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rmp-serde = "1.1"

[features]
dhat-heap = ["dep:dhat"]

[profile.release]
debug = true
[[bench]]
name="bench_demo01"
harness= false

[[bench]]
name="bench_exo01"
harness= false

[[bench]]
name="bench_exo02"
harness= false
