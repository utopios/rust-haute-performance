[package]
name = "kv-distributed"
version = "0.1.0"
edition = "2021"
authors = ["Formation Rust – Utopios"]
description = " KV Store distribué"

[dependencies]
# Runtime async et primitives réseau
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Stockage interne thread-safe
dashmap = "5.5"

# Sérialisation
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging structuré
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Endpoint metrics HTTP léger
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# Utilitaires
anyhow = "1"
thiserror = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "kv-distributed"
path = "src/main.rs"

[[bin]]
name = "kvc"
path = "src/bin/kvc.rs"

[[bench]]
name = "storage_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
